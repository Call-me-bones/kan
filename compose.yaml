name: kan

services:
  app:
    image: ghcr.io/call-me-bones/kan:set-by-deploy
    container_name: kan
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: https://kan.pdlime.net
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET missing from .env}
      POSTGRES_URL: postgres://kan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}@db:5432/kan
      # Sign-in is Authentik only (OIDC); no Kan passwords.
      NEXT_PUBLIC_ALLOW_CREDENTIALS: "false"
      # Must stay "false": "true" refuses a first OIDC sign-in without an invite
      # (packages/auth/src/hooks.ts:32-41). Authentik's pdlime-users group decides who gets in.
      NEXT_PUBLIC_DISABLE_SIGN_UP: "false"
      # PdLime patch: /login starts the OIDC sign-in by itself (apps/web/src/views/auth/login/index.tsx).
      NEXT_PUBLIC_OIDC_AUTO_SIGN_IN: "true"
      # PdLime patch: Logout also ends the Authentik session (apps/web/src/components/UserMenu.tsx).
      NEXT_PUBLIC_SIGN_OUT_URL: https://auth.pdlime.net/flows/-/default/invalidation/
      RUN_MIGRATIONS: "true"
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID missing from .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET missing from .env}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?OIDC_DISCOVERY_URL missing from .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: kan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kan
      POSTGRES_USER: kan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kan -d kan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db: